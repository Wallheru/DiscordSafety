[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/discord-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/api/logout"
  to = "/.netlify/functions/logout"
  status = 200
  force = true

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/teams"
  to = "/.netlify/functions/teams"
  status = 200

[[redirects]]
  from = "/api/team-workflows"
  to = "/.netlify/functions/team-workflows"
  status = 200

[[redirects]]
  from = "/api/discord-invite"
  to = "/.netlify/functions/discord-invite"
  status = 200

[[redirects]]
  from = "/api/workflows"
  to = "/.netlify/functions/workflows"
  status = 200
